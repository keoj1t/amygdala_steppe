services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: content_factory
      POSTGRES_USER: content_factory
      POSTGRES_PASSWORD: content_factory
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U content_factory -d content_factory"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://content_factory:content_factory@postgres:5432/content_factory
      JWT_SECRET_KEY: replace-this-with-a-long-production-secret
      BACKEND_CORS_ORIGINS: http://localhost:3000
      UPLOAD_DIR: storage/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/storage/uploads

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_uploads:
