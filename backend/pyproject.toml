[project]
name = "ai-content-factory-backend"
version = "1.0.0"
description = "Production-ready FastAPI backend for AI Content Factory"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.20.0",
  "alembic>=1.13.2",
  "bcrypt==4.0.1",
  "email-validator>=2.2.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "Pillow>=10.4.0",
  "instaloader>=4.14",
  "passlib[bcrypt]>=1.7.4",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.4.0",
  "pyjwt>=2.9.0",
  "python-multipart>=0.0.9",
  "qrcode[pil]>=7.4.2",
  "sqlalchemy[asyncio]>=2.0.32",
  "yt-dlp>=2025.1.0",
  "uvicorn[standard]>=0.30.6"
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29.0"]
dev = ["pytest>=8.3.2", "pytest-asyncio>=0.23.8", "httpx>=0.27.0", "ruff>=0.6.2"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
